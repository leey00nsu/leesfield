name: Production readiness

on:
  pull_request:
    paths:
      - ".github/workflows/production-readiness.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "docker-compose.yml"
      - "next.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "prisma/**"
      - "scripts/**"
      - "src/**"
      - "ops/**"
      - "vitest.config.ts"
      - "tsconfig.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/production-readiness.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "docker-compose.yml"
      - "next.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "prisma/**"
      - "scripts/**"
      - "src/**"
      - "ops/**"
      - "vitest.config.ts"
      - "tsconfig.json"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:production-integration
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm security:production
      - run: pnpm load:stub-smoke
      - run: docker compose config
      - run: docker build --tag leesfield:ci .
