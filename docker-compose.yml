services:
  postgres:
    image: postgres:16
    container_name: leesfield-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leesfield}
      POSTGRES_USER: ${POSTGRES_USER:-leesfield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leesfield}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
